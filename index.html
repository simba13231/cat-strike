<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CATSTRIKE — Team Deathmatch</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0e14;
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;}
  canvas{display:block;}
  #game{position:fixed;inset:0;}
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;}
  #hud.on{opacity:1;}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.35) 100%);}
  #crosshair{position:fixed;left:50%;top:50%;width:0;height:0;pointer-events:none;--gap:6px;}
  #crosshair .arm{position:absolute;background:#fff;box-shadow:0 0 3px rgba(0,0,0,.9);transition:background .08s;}
  #crosshair .arm.left{width:9px;height:2px;top:-1px;left:-1px;transform:translateX(calc(-100% - var(--gap)));}
  #crosshair .arm.right{width:9px;height:2px;top:-1px;left:1px;transform:translateX(var(--gap));}
  #crosshair .arm.top{width:2px;height:9px;left:-1px;top:-1px;transform:translateY(calc(-100% - var(--gap)));}
  #crosshair .arm.bottom{width:2px;height:9px;left:-1px;top:1px;transform:translateY(var(--gap));}
  #crosshair .dot{position:absolute;width:2px;height:2px;left:-1px;top:-1px;background:#fff;border-radius:50%;}
  #crosshair.hit .arm,#crosshair.hit .dot{background:#ff4d5a;}
  #crosshair.kill .arm,#crosshair.kill .dot{background:#ffd93d;}
  #hitmarker{position:fixed;left:50%;top:50%;width:38px;height:38px;
    transform:translate(-50%,-50%) rotate(45deg);opacity:0;pointer-events:none;}
  #hitmarker.show{animation:hm .18s ease-out;}
  #hitmarker i{position:absolute;background:#fff;box-shadow:0 0 4px #000;}
  #hitmarker i:nth-child(1){width:2px;height:12px;left:18px;top:0}
  #hitmarker i:nth-child(2){width:2px;height:12px;left:18px;bottom:0}
  #hitmarker i:nth-child(3){width:12px;height:2px;top:18px;left:0}
  #hitmarker i:nth-child(4){width:12px;height:2px;top:18px;right:0}
  @keyframes hm{0%{opacity:1;transform:translate(-50%,-50%) rotate(45deg) scale(.6)}
                100%{opacity:0;transform:translate(-50%,-50%) rotate(45deg) scale(1.35)}}
  .dmgnum{position:fixed;left:0;top:0;color:#fff;font-size:20px;font-weight:bold;
    text-shadow:0 2px 4px #000,0 0 8px rgba(0,0,0,.85);pointer-events:none;z-index:10;will-change:transform,opacity;}
  .dmgnum.head{color:#ffd93d;font-size:26px;}
  .dmgnum.kill{color:#ff5a6e;font-size:28px;text-shadow:0 2px 4px #000,0 0 14px rgba(255,60,90,.85);}
  .bonusnum{position:fixed;left:0;top:0;color:#ffd93d;font-size:16px;font-weight:bold;
    text-shadow:0 2px 4px #000,0 0 8px rgba(255,200,60,.6);pointer-events:none;z-index:10;will-change:transform,opacity;}
  #dmgDir{position:fixed;left:50%;top:50%;width:130px;height:130px;
    transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .12s;}
  #dmgDir.on{opacity:1;}
  #dmgDir .arrow{position:absolute;left:50%;top:-2px;width:0;height:0;transform:translateX(-50%);
    border-left:11px solid transparent;border-right:11px solid transparent;
    border-bottom:20px solid #ff2d4a;filter:drop-shadow(0 0 6px rgba(255,45,74,.95));}
  #minimap{position:fixed;top:78px;left:22px;width:170px;height:170px;border-radius:16px;
    border:4px solid #fff;background:rgba(10,14,22,.7);
    box-shadow:0 8px 26px rgba(0,0,0,.55);}
  .marker{position:fixed;color:#bfe4ff;font-size:12px;font-weight:bold;letter-spacing:1px;
    text-shadow:0 1px 4px #000;pointer-events:none;padding:2px 9px;background:rgba(10,20,40,.55);
    border-radius:9px;border:2px solid rgba(120,190,255,.6);white-space:nowrap;
    transform:translate(-50%,-50%);will-change:transform;}
  .enemyTag{position:fixed;color:#ff8b95;font-size:13px;font-weight:bold;letter-spacing:1.5px;
    text-shadow:0 1px 4px #000,0 0 8px rgba(255,60,90,.55);pointer-events:none;padding:3px 11px;
    background:rgba(40,10,15,.75);border:2px solid rgba(255,80,100,.65);border-radius:9px;
    white-space:nowrap;transform:translate(-50%,-50%);will-change:transform;z-index:6;}
  #enemyHPBar{position:fixed;left:0;top:0;width:60px;height:7px;pointer-events:none;z-index:6;
    background:rgba(0,0,0,.7);border:2px solid rgba(255,255,255,.5);border-radius:4px;
    transform:translate(-50%,-50%);display:none;overflow:hidden;}
  #enemyHPBarFill{position:absolute;left:0;top:0;height:100%;width:100%;
    background:linear-gradient(90deg,#ff4757,#ff8b95);border-radius:2px;transition:width .12s;}
  #announce{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);font-size:46px;
    font-weight:bold;letter-spacing:8px;color:#ffd93d;
    text-shadow:0 4px 18px rgba(0,0,0,.9),0 0 26px rgba(255,217,61,.45);
    opacity:0;pointer-events:none;z-index:20;white-space:nowrap;}
  #announce.on{animation:an 1.5s ease-out;}
  @keyframes an{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
    18%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
    30%{transform:translate(-50%,-50%) scale(1)}
    78%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}
  #spawnShield{position:fixed;left:50%;bottom:132px;transform:translateX(-50%);color:#7fe4ff;
    font-size:13px;letter-spacing:4px;font-weight:bold;
    text-shadow:0 0 10px rgba(80,200,255,.85);opacity:0;transition:opacity .2s;}
  #spawnShield.on{opacity:1;}
  #lowHP{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:5;
    background:radial-gradient(ellipse at center,rgba(255,0,0,0) 45%,rgba(200,0,30,.75) 100%);
    transition:opacity .25s;}
  #lowHP.on{opacity:1;animation:hpPulse 1.2s ease-in-out infinite;}
  @keyframes hpPulse{0%,100%{opacity:.35}50%{opacity:.75}}
  #healthBox{position:fixed;left:26px;bottom:26px;display:flex;align-items:center;gap:12px;}
  #healthIcon{width:52px;height:52px;border-radius:14px;background:rgba(10,14,22,.85);
    border:3px solid #fff;display:flex;align-items:center;justify-content:center;
    font-size:24px;box-shadow:0 4px 12px rgba(0,0,0,.5);}
  #healthBarOuter{width:210px;height:20px;border-radius:11px;background:rgba(10,14,22,.85);
    border:3px solid #fff;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.5);}
  #healthBar{height:100%;width:100%;border-radius:8px;
    background:linear-gradient(90deg,#2ee68a,#7cf7b6);transition:width .15s,background .2s;}
  #healthNum{font-size:30px;font-weight:bold;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.9),0 0 4px #000;min-width:60px;}
  #ammoBox{position:fixed;right:26px;bottom:22px;text-align:right;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.9),0 0 4px #000;}
  #weaponName{font-size:18px;letter-spacing:4px;font-weight:bold;color:#ffd93d;
    text-shadow:0 2px 8px rgba(0,0,0,.95),0 0 8px rgba(255,217,61,.4);
    margin-bottom:2px;}
  #ammoNums{font-size:58px;font-weight:bold;line-height:0.95;
    text-shadow:0 3px 10px rgba(0,0,0,.95),0 0 4px #000;}
  #ammoNums small{font-size:24px;opacity:.55;}
  #reloadHint{font-size:13px;color:#ffd93d;letter-spacing:2px;height:16px;font-weight:bold;}
  #scoreBar{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;
    gap:22px;background:rgba(10,14,22,.88);border:4px solid #fff;border-radius:18px;
    padding:6px 26px;color:#fff;font-weight:bold;box-shadow:0 8px 26px rgba(0,0,0,.5);}
  .teamScore{font-size:42px;min-width:70px;text-align:center;line-height:1;
    font-family:'Trebuchet MS',sans-serif;}
  #blueScore{color:#5cc7ff;text-shadow:0 0 16px rgba(77,180,255,.85);}
  #redScore{color:#ff5c6b;text-shadow:0 0 16px rgba(255,77,90,.85);}
  #timer{font-size:20px;opacity:.9;min-width:72px;text-align:center;letter-spacing:2px;
    font-weight:bold;color:#ffd93d;}
  .vs{font-size:18px;opacity:.35;letter-spacing:1px;font-weight:bold;}
  #killfeed{position:fixed;top:16px;right:20px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
  .kf{background:rgba(10,14,22,.85);border-left:5px solid #888;border-radius:9px;padding:6px 14px;
    color:#fff;font-size:14px;font-weight:bold;animation:kfin .25s ease-out;white-space:nowrap;
    box-shadow:0 3px 10px rgba(0,0,0,.4);}
  .kf.blue{border-left-color:#4db4ff;} .kf.red{border-left-color:#ff4d5a;}
  .kf .arrow{opacity:.65;margin:0 8px;font-size:14px;color:#ffd93d;}
  .kf.fade{opacity:0;transform:translateX(20px);transition:.4s;}
  @keyframes kfin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
  #dmgFlash{position:fixed;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at center,rgba(255,0,0,0) 40%,rgba(200,0,20,.75) 100%);}
  #dmgFlash.on{animation:df .35s ease-out;}
  @keyframes df{0%{opacity:1}100%{opacity:0}}
  #scope{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .12s;
    background:radial-gradient(circle at center,rgba(0,0,0,0) 24%,rgba(0,0,0,.97) 30%);}
  #scope.on{opacity:1;}
  #scope::after{content:'';position:absolute;left:50%;top:50%;width:44vmin;height:44vmin;
    transform:translate(-50%,-50%);border:2px solid rgba(0,0,0,.9);border-radius:50%;}
  #scopeCross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44vmin;height:44vmin;}
  #scopeCross::before,#scopeCross::after{content:'';position:absolute;background:#000;opacity:.85;}
  #scopeCross::before{left:50%;top:0;width:1px;height:100%;}
  #scopeCross::after{top:50%;left:0;height:1px;width:100%;}
  #killcam{position:fixed;inset:0;pointer-events:none;display:none;z-index:25;}
  #killcam.on{display:block;animation:kcIn .3s ease-out;}
  @keyframes kcIn{from{opacity:0}to{opacity:1}}
  #killcam .vignette{position:absolute;inset:0;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 30%,rgba(0,0,0,.85) 100%);
    box-shadow:inset 0 0 240px rgba(0,0,0,.9);}
  #killcam .bar{position:absolute;left:0;right:0;height:64px;background:#000;box-shadow:0 0 20px rgba(0,0,0,.8);}
  #killcam .bar.top{top:0;}
  #killcam .bar.bottom{bottom:0;}
  #killcam .label{position:absolute;left:50%;top:80px;transform:translateX(-50%);color:#ff8b95;
    font-size:16px;font-weight:bold;letter-spacing:10px;text-shadow:0 2px 10px #000,0 0 18px rgba(255,60,90,.6);}
  #killcam .subLabel{position:absolute;left:50%;top:110px;transform:translateX(-50%);color:#fff;
    font-size:22px;font-weight:bold;letter-spacing:6px;text-shadow:0 2px 10px #000;}
  #killcam .skip{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);
    color:rgba(255,255,255,.65);font-size:13px;font-weight:bold;letter-spacing:4px;
    text-shadow:0 2px 8px #000;animation:skipBlink 1.4s ease-in-out infinite;}
  @keyframes skipBlink{0%,100%{opacity:.4}50%{opacity:.9}}
  #deathScreen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(5,10,20,.88) 0%,rgba(3,8,18,.94) 100%);z-index:30;}
  #deathScreen.on{display:flex;animation:dsIn .25s ease-out;}
  @keyframes dsIn{from{opacity:0}to{opacity:1}}
  #deathScreen,#deathScreen *{cursor:default;}
  #deathScreen button{cursor:pointer;}
  .ds-card{width:min(560px,92vw);background:rgba(15,22,36,.96);
    border:3px solid rgba(255,90,110,.55);border-radius:20px;padding:24px 28px 22px;
    box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 60px rgba(255,60,90,.15);
    color:#e8eaf0;}
  .ds-title{font-size:36px;font-weight:bold;letter-spacing:8px;text-align:center;
    color:#ff4d5a;text-shadow:0 2px 12px rgba(255,60,90,.55);margin-bottom:6px;}
  .ds-killer{text-align:center;font-size:14px;letter-spacing:2px;color:#ffd0d5;
    min-height:20px;margin-bottom:16px;font-weight:bold;}
  .ds-lb-title{text-align:center;letter-spacing:6px;font-size:13px;color:rgba(255,255,255,.5);
    font-weight:bold;margin-bottom:10px;}
  .ds-lb{background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.1);border-radius:12px;
    padding:8px 6px;margin-bottom:18px;max-height:280px;overflow-y:auto;}
  .lb-head,.lb-row{display:grid;grid-template-columns:32px 1fr 52px 30px 30px;gap:6px;
    padding:7px 12px;font-size:13px;align-items:center;}
  .lb-head{color:rgba(255,255,255,.4);font-weight:bold;letter-spacing:2px;font-size:11px;
    border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:8px;margin-bottom:4px;}
  .lb-row{border-radius:6px;font-weight:bold;}
  .lb-row.blue{background:rgba(77,180,255,.08);}
  .lb-row.red{background:rgba(255,77,90,.08);}
  .lb-row.me{outline:2px solid rgba(255,217,61,.7);background:rgba(255,217,61,.14);}
  .lb-row .tm{font-size:10px;letter-spacing:1px;text-align:center;opacity:.75;}
  .lb-row.blue .tm{color:#7cc7ff;}
  .lb-row.red .tm{color:#ff8b95;}
  .lb-row span:nth-child(4),.lb-row span:nth-child(5){text-align:center;}
  .ds-btns{display:flex;gap:10px;}
  .ds-btn{flex:1;padding:14px;border-radius:12px;border:3px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.06);color:#fff;font-family:inherit;font-size:15px;
    font-weight:bold;letter-spacing:3px;cursor:pointer;transition:.12s;}
  .ds-btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);}
  .ds-btn:active{transform:translateY(2px);}
  .ds-btn.primary{background:linear-gradient(180deg,#4a9dff,#2270d8);
    color:#fff;border-color:#5aadff;box-shadow:0 4px 0 #175099;}
  .ds-btn.primary:hover{filter:brightness(1.08);}
  .ds-btn.primary:active{box-shadow:0 2px 0 #175099;transform:translateY(3px);}
  #scoreboard{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(10,14,22,.94);border:3px solid rgba(255,255,255,.2);border-radius:18px;
    padding:22px 26px;display:none;color:#fff;min-width:520px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);z-index:15;}
  #scoreboard.on{display:block;}
  #scoreboard h3{text-align:center;letter-spacing:5px;font-size:20px;margin-bottom:14px;opacity:.9;}
  .sbrow{display:flex;justify-content:space-between;padding:6px 12px;border-radius:7px;font-size:15px;margin-bottom:3px;}
  .sbrow.blue{background:rgba(77,180,255,.12);}
  .sbrow.red{background:rgba(255,77,90,.12);}
  .sbrow.me{outline:2px solid rgba(255,217,61,.6);}
  .sbrow span:first-child{font-weight:bold;}
  .sbrow .sc{opacity:.8;}
  #menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#5b8fd0 0%,#3d6ba8 30%,#2a4f7c 60%,#1e3a5c 100%);z-index:50;}
  #menu.hide{display:none;}
  #menu::before{content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 50% 20%,rgba(255,255,255,.25) 0%,rgba(255,255,255,0) 55%);
    pointer-events:none;}
  .card{position:relative;width:min(880px,94vw);background:rgba(240,246,255,.94);
    border:3px solid rgba(255,255,255,.7);border-radius:24px;padding:28px 34px 22px;
    box-shadow:0 30px 80px rgba(0,20,50,.5);}
  .title{text-align:center;font-size:56px;font-weight:bold;letter-spacing:8px;line-height:1;
    background:linear-gradient(180deg,#2a3f5c 0%,#1a2638 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 8px rgba(80,140,220,.35));}
  .title span{background:linear-gradient(180deg,#2a7dd0,#1560b0);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{text-align:center;color:#5a6b85;letter-spacing:6px;font-size:13px;margin:8px 0 22px;font-weight:bold;}
  .body{display:grid;grid-template-columns:1fr 1fr;gap:26px;}
  .preview-wrap{background:radial-gradient(circle at 50% 30%,#e8f0fc,#c9d9ec);
    border-radius:18px;border:3px solid rgba(140,170,210,.5);overflow:hidden;height:330px;
    display:flex;align-items:center;justify-content:center;}
  #preview{width:100%;height:100%;}
  .panel{display:flex;flex-direction:column;gap:11px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:rgba(255,255,255,.75);border:3px solid rgba(140,170,210,.4);
    border-radius:12px;padding:8px 14px;}
  .row label{color:#3a4a60;font-size:13px;letter-spacing:2px;font-weight:bold;}
  .row input[type=text]{background:#fff;border:3px solid rgba(140,170,210,.5);
    color:#1a2638;font-size:15px;font-weight:bold;padding:5px 10px;border-radius:8px;width:150px;
    outline:none;font-family:inherit;letter-spacing:1px;}
  .row input[type=text]:focus{border-color:#3a7dd0;}
  .row input[type=color]{width:56px;height:32px;border:3px solid rgba(140,170,210,.5);
    border-radius:8px;background:transparent;cursor:pointer;padding:0;}
  .row input[type=color]::-webkit-color-swatch-wrapper{padding:2px;}
  .row input[type=color]::-webkit-color-swatch{border:none;border-radius:5px;}
  .teams,.modes{display:flex;gap:8px;}
  .teams button,.modes button{flex:1;padding:10px 4px;border-radius:11px;
    border:3px solid rgba(140,170,210,.4);background:rgba(255,255,255,.7);
    color:#5a6b85;font-weight:bold;letter-spacing:1px;font-size:12px;cursor:pointer;
    font-family:inherit;transition:.15s;}
  .teams button:hover,.modes button:hover{background:#fff;border-color:rgba(140,170,210,.7);}
  .teams button[data-team=blue].active{background:#d5e8ff;border-color:#3a7dd0;color:#1550a0;}
  .teams button[data-team=red].active{background:#ffdadf;border-color:#d0435a;color:#a02030;}
  .modes button.active{background:#ffe8b0;border-color:#d09a20;color:#8a5a00;}
  .modes button{font-size:13px;letter-spacing:2px;}
  .play{margin-top:4px;padding:16px;border-radius:14px;border:3px solid #6ab8ff;cursor:pointer;
    font-family:inherit;font-size:22px;font-weight:bold;letter-spacing:6px;color:#fff;
    background:linear-gradient(180deg,#4a9dff,#2270d8);
    box-shadow:0 6px 0 #175099,0 10px 26px rgba(40,120,220,.4);transition:.1s;}
  .play:hover{filter:brightness(1.06);}
  .play:active{transform:translateY(4px);box-shadow:0 2px 0 #175099;}
  .hint{text-align:center;color:#6a7a90;font-size:12px;margin-top:16px;
    letter-spacing:1px;line-height:1.7;font-weight:bold;}
  #pause{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:rgba(10,14,22,.85);z-index:40;}
  #pause.on{display:flex;}
  #pause h2{color:#fff;font-size:38px;letter-spacing:8px;margin-bottom:22px;}
  #pause .pbtn{padding:14px 42px;border-radius:13px;border:3px solid #6ab8ff;cursor:pointer;margin-bottom:12px;
    font-family:inherit;font-size:17px;font-weight:bold;letter-spacing:4px;
    background:linear-gradient(180deg,#ffe066,#ffb020);color:#1a1206;box-shadow:0 5px 0 #b87708;}
  #pause .pbtn.alt{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.4);border-color:rgba(255,255,255,.3);}
  #pause .pbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #b87708;}
  #pause .pbtn.alt:active{box-shadow:0 2px 0 rgba(0,0,0,.4);}
  #settings{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(10,14,22,.85);z-index:41;}
  #settings.on{display:flex;}
  #settings .scard{background:rgba(17,23,35,.95);border:3px solid rgba(255,255,255,.15);border-radius:20px;
    padding:26px 32px;min-width:400px;color:#fff;box-shadow:0 30px 80px rgba(0,0,0,.7);}
  #settings h3{letter-spacing:6px;font-size:20px;margin-bottom:20px;text-align:center;opacity:.9;}
  .setrow{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .setrow label{width:120px;font-size:12px;letter-spacing:2px;font-weight:bold;opacity:.75;}
  .setrow input[type=range]{flex:1;accent-color:#ffd93d;}
  .setrow .val{width:56px;text-align:right;font-weight:bold;font-size:14px;color:#ffd93d;}
  #settings .closeBtn{margin-top:8px;width:100%;padding:12px;border-radius:11px;border:3px solid #6ab8ff;cursor:pointer;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand =(a,b)=>a+Math.random()*(b-a);
const pick =arr=>arr[Math.floor(Math.random()*arr.length)];
const lerp =(a,b,t)=>a+(b-a)*t;
const $=id=>document.getElementById(id);

const settings={sens:1.0,fov:78,volume:1.0};
try{const s=JSON.parse(localStorage.getItem('catstrike_settings')||'{}');
  if(typeof s.sens==='number')settings.sens=clamp(s.sens,0.3,3);
  if(typeof s.fov==='number')settings.fov=clamp(s.fov,60,110);
  if(typeof s.volume==='number')settings.volume=clamp(s.volume,0,1);}catch(e){}
function saveSettings(){try{localStorage.setItem('catstrike_settings',JSON.stringify(settings));}catch(e){}}

let actx=null,noiseBuf=null;
function initAudio(){
  if(actx){if(actx.state==='suspended')actx.resume();return;}
  try{actx=new (window.AudioContext||window.webkitAudioContext)();
    const len=Math.floor(actx.sampleRate*0.8);
    noiseBuf=actx.createBuffer(1,len,actx.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  }catch(e){actx=null;}
}
function sfxShot(kind,vol){
  if(!actx||!noiseBuf)return;vol=(vol===undefined?0.22:vol)*settings.volume;
  if(vol<=0)return;const t=actx.currentTime;
  const src=actx.createBufferSource();src.buffer=noiseBuf;
  src.playbackRate.value=kind==='sniper'?0.65:kind==='shotgun'?0.85:1.25;
  const f=actx.createBiquadFilter();f.type='lowpass';
  const f0=kind==='sniper'?1100:kind==='shotgun'?1600:2600;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(160,t+0.18);
  const g=actx.createGain();g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0008,t+0.22);
  src.connect(f);f.connect(g);g.connect(actx.destination);src.start(t);src.stop(t+0.25);
}
function sfxTone(freq,dur,type,vol,slideTo){
  if(!actx)return;vol=(vol||0.08)*settings.volume;if(vol<=0)return;
  const t=actx.currentTime;const o=actx.createOscillator();o.type=type||'square';
  o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  const g=actx.createGain();g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0005,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.02);
}
function sfxStep(hard){
  if(!actx||!noiseBuf)return;const vol=0.05*settings.volume;if(vol<=0)return;
  const t=actx.currentTime;const src=actx.createBufferSource();src.buffer=noiseBuf;
  src.playbackRate.value=hard?2.2:1.4;
  const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=hard?900:340;
  const g=actx.createGain();g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0005,t+0.09);
  src.connect(f);f.connect(g);g.connect(actx.destination);src.start(t);src.stop(t+0.11);
}
function sfxSlide(){
  if(!actx||!noiseBuf)return;const vol=0.08*settings.volume;if(vol<=0)return;
  const t=actx.currentTime;const src=actx.createBufferSource();src.buffer=noiseBuf;
  src.playbackRate.value=0.75;
  const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=420;f.Q.value=1.4;
  const g=actx.createGain();g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0005,t+0.42);
  src.connect(f);f.connect(g);g.connect(actx.destination);src.start(t);src.stop(t+0.44);
}
function sfxJumpPad(){
  if(!actx)return;
  const t=actx.currentTime;const o=actx.createOscillator();o.type='sine';
  o.frequency.setValueAtTime(280,t);
  o.frequency.exponentialRampToValueAtTime(1100,t+0.18);
  const g=actx.createGain();g.gain.setValueAtTime(0.09*settings.volume,t);
  g.gain.exponentialRampToValueAtTime(0.0005,t+0.28);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.30);
}

function getMat(hex){
  const k=hex.toString();

}
function addBox(px,py,pz,sx,sy,sz,color,solid){
  const geo=new THREE.BoxGeometry(sx,sy,sz);
  const mesh=new THREE.Mesh(geo,getMat(color));

  world.add(mesh);
  const edges=new THREE.EdgesGeometry(geo);

  world.add(line);
  if(solid!==false){
    colliders.push({min:{x:px-sx/2,y:py-sy/2,z:pz-sz/2},max:{x:px+sx/2,y:py+sy/2,z:pz+sz/2}});
  }
  return mesh;
}

function addFence(px,pz,rot,len){
  const postMat=new THREE.MeshLambertMaterial({color:0x8a6a48});
  const n=Math.max(2,Math.round(len/1.2));
  for(let i=0;i<=n;i++){
    const t=i/n-0.5;
    const cx=px+Math.cos(rot)*t*len;
    const cz=pz+Math.sin(rot)*t*len;
    const geo=new THREE.BoxGeometry(0.15,1.3,0.15);
    const post=new THREE.Mesh(geo,postMat);
    post.position.set(cx,0.65,cz);post.rotation.y=-rot;
    world.add(post);
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),outlineLineMat);
    e.position.copy(post.position);e.rotation.copy(post.rotation);
    world.add(e);
  }
  [0.4,0.95].forEach(h=>{
    const geo=new THREE.BoxGeometry(len,0.1,0.08);
    const rail=new THREE.Mesh(geo,postMat);
    rail.position.set(px,h,pz);rail.rotation.y=-rot;
    world.add(rail);
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),outlineLineMat);
    e.position.copy(rail.position);e.rotation.copy(rail.rotation);
    world.add(e);
  });
  const c=Math.cos(rot)*len/2,s=Math.sin(rot)*len/2;
  colliders.push({
    min:{x:px-Math.abs(c)-0.15,y:0,z:pz-Math.abs(s)-0.15},
    max:{x:px+Math.abs(c)+0.15,y:1.3,z:pz+Math.abs(s)+0.15}
  });
}

/* these weapon-part materials are shared across every buildWeapon() call
   (view models, world drops, everyone's held gun) — never dispose them.
   Only the geometries buildWeapon() creates are per-call and safe to free. */
for(const sharedMat of [matMetal,matGunBody,matWood,matAccent,matScope,outlineLineMat])

function buildWeapon(type){
  const g=new THREE.Group();
  const add=(geo,mat,x,y,z,rx,ry,rz)=>{
    const m=new THREE.Mesh(geo,mat);
    m.position.set(x,y,z);
    if(rx)m.rotation.x=rx;if(ry)m.rotation.y=ry;if(rz)m.rotation.z=rz;
    g.add(m);
    const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo),outlineLineMat);
    edges.position.copy(m.position);edges.rotation.copy(m.rotation);
    g.add(edges);
    return m;
  };
  if(type==='pistol'){
    add(new THREE.BoxGeometry(0.11,0.16,0.36),matGunBody,0,0,0.02);
    add(new THREE.BoxGeometry(0.07,0.07,0.22),matMetal,0,0.02,0.26);

    add(new THREE.BoxGeometry(0.04,0.04,0.04),matAccent,0,0.1,0.18);
  }else if(type==='shotgun'){
    add(new THREE.BoxGeometry(0.13,0.15,0.62),matWood,0,0,0.12);
    add(new THREE.BoxGeometry(0.08,0.08,0.72),matMetal,0,0.03,0.62);

  }else{

    add(new THREE.BoxGeometry(0.055,0.055,0.95),matMetal,0,0.02,0.9);

    sc.rotation.x=Math.PI/2;sc.position.set(0,0.14,0.18);g.add(sc);

  }
  return g;
}

/* ---------- PICKUPS (10s despawn) ---------- */
const pickups=[];
const PICKUP_LIFE=10;
const PICKUP_RING_GEO=new THREE.TorusGeometry(0.6,0.07,8,20);
function disposePickupVisuals(p){
  /* free the per-instance geometries/materials buildWeapon() and the ring create.
     Shared weapon-part materials (tagged .userData.shared) and shared geometries
     (PICKUP_RING_GEO) are left alone since they're reused everywhere else. */
  p.group.traverse(obj=>{
    if(obj.geometry&&obj.geometry!==PICKUP_RING_GEO)obj.geometry.dispose();
    if(obj.material&&!obj.material.userData.shared)obj.material.dispose();
  });
}
function spawnPickup(weapon,pos){
  if(!WEAPONS[weapon])return;
  const g=new THREE.Group();
  const m=buildWeapon(weapon);
  m.scale.setScalar(1.2);
  g.add(m);
  const ring=new THREE.Mesh(PICKUP_RING_GEO,new THREE.MeshBasicMaterial({color:0xffd93d}));
  ring.rotation.x=Math.PI/2;ring.position.y=0.06;g.add(ring);
  g.position.set(pos.x,0.55,pos.z);
  scene.add(g);
  pickups.push({group:g,weapon,ring,bornAt:performance.now()});
}
function updatePickups(dt,now){
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];
    const age=(now-p.bornAt)/1000;
    if(age>PICKUP_LIFE){
      scene.remove(p.group);
      disposePickupVisuals(p);
      pickups.splice(i,1);
      continue;
    }
    p.group.position.y=0.55+Math.sin(now*0.003)*0.09;
    p.group.rotation.y+=dt*1.4;
    p.ring.rotation.z+=dt*2;
    /* blink when about to despawn */
    if(age>PICKUP_LIFE-3){
      p.group.visible=Math.floor(age*8)%2===0;
    }
    if(player.alive){
      const dx=player.pos.x-p.group.position.x,dz=player.pos.z-p.group.position.z;
      if(dx*dx+dz*dz<1.5*1.5){
        const full=WEAPONS[p.weapon].mag;
        if(p.weapon!==player.weapon||player.ammo[p.weapon]<full){
          player.ammo[p.weapon]=full;
          if(p.weapon!==player.weapon){
            player.weapon=p.weapon;
            player.reloading=0;player.fireCd=0.15;
            player.switchState='idle';player.pendingWeapon=null;
            for(const k in viewModels)viewModels[k].visible=(k===p.weapon);
          }
          sfxPickup();
          announce('PICKED UP '+WEAPONS[p.weapon].name);
          scene.remove(p.group);
          disposePickupVisuals(p);
          pickups.splice(i,1);
        }
      }
    }
  }
}
function clearPickups(){
  for(const p of pickups){scene.remove(p.group);disposePickupVisuals(p);}
  pickups.length=0;
}

  const upV=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
  const backV=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  casings.push({
    mesh:m,
    vel:new THREE.Vector3()
      .addScaledVector(rightV, rand(1.8,2.8))
      .addScaledVector(upV, rand(1.6,2.4))
      .addScaledVector(backV, rand(-0.6,0.2)),
    spin:new THREE.Vector3(rand(-10,10),rand(-10,10),rand(-10,10)),
    life:1.6
  });
}
function updateCasings(dt){
  for(let i=casings.length-1;i>=0;i--){
    const c=casings[i];
    c.life-=dt;
    if(c.life<=0){scene.remove(c.mesh);c.mesh.material.dispose();casings.splice(i,1);continue;}
    c.vel.y+=GRAVITY*0.55*dt;
    c.mesh.position.addScaledVector(c.vel,dt);
    c.mesh.rotation.x+=c.spin.x*dt;
    c.mesh.rotation.y+=c.spin.y*dt;
    c.mesh.rotation.z+=c.spin.z*dt;
    if(c.mesh.position.y<0.03){
      c.mesh.position.y=0.03;
      c.vel.y=Math.abs(c.vel.y)*0.35;
      c.vel.x*=0.6;c.vel.z*=0.6;
      c.spin.multiplyScalar(0.5);
    }
  }
}

const snapshotBuffer=[];

function recordSnapshots(now){
  if(now<nextSnapshotAt)return;
  nextSnapshotAt=now+66;
  const entry={t:now,chars:[]};
  for(const c of chars){

    entry.chars.push({id:c.id,x:c.pos.x,y:c.pos.y,z:c.pos.z,
      yaw:c.yaw,pitch:c.isPlayer?(c.pitch||0):0});
  }
  snapshotBuffer.push(entry);
  while(snapshotBuffer.length>0&&now-snapshotBuffer[0].t>2500)snapshotBuffer.shift();
}
function startKillcam(killer){
  const snaps=[];
  for(const s of snapshotBuffer){
    const kc=s.chars.find(c=>c.id===killer.id);
    if(kc)snaps.push({t:s.t,x:kc.x,y:kc.y,z:kc.z,yaw:kc.yaw,pitch:kc.pitch});
  }
  if(snaps.length<3){showDeathScreen();return;}
  killcam.active=true;killcam.time=0;
  killcam.duration=Math.min(2.0,(snaps[snaps.length-1].t-snaps[0].t)/1000);
  killcam.killerSnapshots=snaps;killcam.killerBot=killer;
  if(killer.mesh)killer.mesh.visible=false;
  viewModelRoot.visible=false;
  hud.classList.remove('on');
  scopeEl.classList.remove('on');
  $('killcamKiller').textContent=killer.name.toUpperCase();
  $('killcam').classList.add('on');
  if(document.pointerLockElement)document.exitPointerLock();
}
function updateKillcam(dt){
  killcam.time+=dt;
  if(killcam.time>=killcam.duration){endKillcam();return;}
  if(killcam.killerBot&&killcam.killerBot.mesh)killcam.killerBot.mesh.visible=false;
  const snaps=killcam.killerSnapshots;
  const startT=snaps[0].t;
  const targetT=startT+killcam.time*1000;
  let a=snaps[0],b=snaps[snaps.length-1];
  for(let i=0;i<snaps.length-1;i++){
    if(snaps[i].t<=targetT&&snaps[i+1].t>=targetT){a=snaps[i];b=snaps[i+1];break;}
  }
  const span=Math.max(1,b.t-a.t);
  const u=clamp((targetT-a.t)/span,0,1);
  const x=lerp(a.x,b.x,u),y=lerp(a.y,b.y,u),z=lerp(a.z,b.z,u);
  let yawDelta=b.yaw-a.yaw;
  while(yawDelta>Math.PI)yawDelta-=Math.PI*2;
  while(yawDelta<-Math.PI)yawDelta+=Math.PI*2;
  const yaw=a.yaw+yawDelta*u;
  const pitch=lerp(a.pitch,b.pitch,u);
  camera.position.set(x,y+EYE_HEIGHT,z);
  camera.rotation.y=yaw;camera.rotation.x=pitch;camera.rotation.z=0;
  camera.fov=lerp(camera.fov,settings.fov*0.92,dt*3);
  camera.updateProjectionMatrix();
  updateEffects(dt);updateDamageNumbers(dt);updateCasings(dt);
}
function endKillcam(){
  killcam.active=false;
  $('killcam').classList.remove('on');
  if(killcam.killerBot&&killcam.killerBot.mesh&&killcam.killerBot.alive)
    killcam.killerBot.mesh.visible=true;
  killcam.killerBot=null;killcam.killerSnapshots=[];
  showDeathScreen();
}

/* ---------- PHYSICS ---------- */
function moveWithCollisions(pos,vel,radius,height,dt){
  pos.x+=vel.x*dt;pos.z+=vel.z*dt;
  let onGround=false,groundTag='grass';
  for(let i=0;i<colliders.length;i++){
    const b=colliders[i];
    if(pos.y+height<=b.min.y+0.06)continue;
    if(pos.y>=b.max.y-0.02)continue;
    const cx=clamp(pos.x,b.min.x,b.max.x);
    const cz=clamp(pos.z,b.min.z,b.max.z);
    let dx=pos.x-cx,dz=pos.z-cz;
    const d2=dx*dx+dz*dz;
    if(d2<radius*radius){
      const stepUp=b.max.y-pos.y;
      if(stepUp>0&&stepUp<=STEP_HEIGHT){
        let clear=true;const nY=b.max.y;
        for(let j=0;j<colliders.length;j++){
          if(j===i)continue;
          const b2=colliders[j];
          const cx2=clamp(pos.x,b2.min.x,b2.max.x);
          const cz2=clamp(pos.z,b2.min.z,b2.max.z);
          const ddx=pos.x-cx2,ddz=pos.z-cz2;
          if(ddx*ddx+ddz*ddz>=radius*radius)continue;
          if(nY+height>b2.min.y&&nY<b2.max.y){clear=false;break;}
        }
        if(clear){pos.y=nY;onGround=true;groundTag='stone';continue;}
      }
      const d=Math.sqrt(d2);
      if(d<1e-4){
        const px=Math.min(pos.x-b.min.x,b.max.x-pos.x);
        const pz=Math.min(pos.z-b.min.z,b.max.z-pos.z);
        const cxm=(b.min.x+b.max.x)/2,czm=(b.min.z+b.max.z)/2;
        if(px<pz)pos.x=pos.x<cxm?b.min.x-radius:b.max.x+radius;
        else pos.z=pos.z<czm?b.min.z-radius:b.max.z+radius;
      }else{
        const push=(radius-d)/d;
        pos.x+=dx*push;pos.z+=dz*push;
      }
    }
  }
  const prevY=pos.y;vel.y+=GRAVITY*dt;pos.y+=vel.y*dt;
  if(pos.y<=0){pos.y=0;vel.y=0;onGround=true;groundTag='grass';}
  for(let i=0;i<colliders.length;i++){
    const b=colliders[i];
    const cx=clamp(pos.x,b.min.x,b.max.x),cz=clamp(pos.z,b.min.z,b.max.z);
    const dx=pos.x-cx,dz=pos.z-cz;
    if(dx*dx+dz*dz>radius*radius)continue;
    if(vel.y<=0&&prevY>=b.max.y-0.02&&pos.y<=b.max.y){
      pos.y=b.max.y;vel.y=0;onGround=true;groundTag='stone';
    }
  }
  return {onGround,tag:groundTag};
}

/* ---------- RAYS ---------- */
function rayAABBN(ox,oy,oz,dx,dy,dz,b){
  let tmin=0,tmax=Infinity,axis=0,sign=1;
  if(Math.abs(dx)<1e-8){if(ox<b.min.x||ox>b.max.x)return null;}
  else{let t1=(b.min.x-ox)/dx,t2=(b.max.x-ox)/dx;let s=t1<t2?-1:1;
       if(t1>t2){const t=t1;t1=t2;t2=t;}
       if(t1>tmin){tmin=t1;axis=0;sign=s;}if(t2<tmax)tmax=t2;if(tmin>tmax)return null;}
  if(Math.abs(dy)<1e-8){if(oy<b.min.y||oy>b.max.y)return null;}
  else{let t1=(b.min.y-oy)/dy,t2=(b.max.y-oy)/dy;let s=t1<t2?-1:1;
       if(t1>t2){const t=t1;t1=t2;t2=t;}
       if(t1>tmin){tmin=t1;axis=1;sign=s;}if(t2<tmax)tmax=t2;if(tmin>tmax)return null;}
  if(Math.abs(dz)<1e-8){if(oz<b.min.z||oz>b.max.z)return null;}
  else{let t1=(b.min.z-oz)/dz,t2=(b.max.z-oz)/dz;let s=t1<t2?-1:1;
       if(t1>t2){const t=t1;t1=t2;t2=t;}
       if(t1>tmin){tmin=t1;axis=2;sign=s;}if(t2<tmax)tmax=t2;if(tmin>tmax)return null;}
  return {t:tmin,axis,sign};
}
function raycastWorldN(ox,oy,oz,dx,dy,dz,maxDist){
  let best=maxDist,bestAxis=-1,bestSign=0;
  for(let i=0;i<colliders.length;i++){
    const r=rayAABBN(ox,oy,oz,dx,dy,dz,colliders[i]);
    if(r!==null&&r.t>=0&&r.t<best){best=r.t;bestAxis=r.axis;bestSign=r.sign;}
  }
  if(bestAxis<0)return {dist:best,nx:0,ny:0,nz:0,hit:false};
  const nx=bestAxis===0?bestSign:0,ny=bestAxis===1?bestSign:0,nz=bestAxis===2?bestSign:0;
  return {dist:best,nx,ny,nz,hit:true};
}
const _tb={min:{x:0,y:0,z:0},max:{x:0,y:0,z:0}};
function raycastChars(ox,oy,oz,dx,dy,dz,maxDist,ignore){
  let best=null,bestT=maxDist;
  for(let i=0;i<chars.length;i++){
    const c=chars[i];
    if(!c.alive||c===ignore||c.spawnProtect>0)continue;
    _tb.min.x=c.pos.x-0.46;_tb.max.x=c.pos.x+0.46;
    _tb.min.z=c.pos.z-0.36;_tb.max.z=c.pos.z+0.36;
    _tb.min.y=c.pos.y+0.50;_tb.max.y=c.pos.y+1.44;
    let t=rayAABBN(ox,oy,oz,dx,dy,dz,_tb);
    if(t!==null&&t.t>=0&&t.t<bestT){bestT=t.t;best={char:c,dist:t.t,head:false};}
    _tb.min.x=c.pos.x-0.36;_tb.max.x=c.pos.x+0.36;
    _tb.min.z=c.pos.z-0.34;_tb.max.z=c.pos.z+0.34;
    _tb.min.y=c.pos.y+1.44;_tb.max.y=c.pos.y+2.02;
    t=rayAABBN(ox,oy,oz,dx,dy,dz,_tb);
    if(t!==null&&t.t>=0&&t.t<bestT){bestT=t.t;best={char:c,dist:t.t,head:true};}
  }
  return best;
}
function hasLOS(ax,ay,az,bx,by,bz){
  const dx=bx-ax,dy=by-ay,dz=bz-az;
  const len=Math.sqrt(dx*dx+dy*dy+dz*dz);
  if(len<0.001)return true;
  const r=raycastWorldN(ax,ay,az,dx/len,dy/len,dz/len,len-0.2);
  return !r.hit||r.dist>=len-0.25;
}

/* ---------- EFFECTS ---------- */
const decalGeo=new THREE.PlaneGeometry(0.15,0.15);
const IMPACT_GEO=new THREE.SphereGeometry(0.045,5,5);
function spawnTracer(a,b,color){
  const g=new THREE.BufferGeometry().setFromPoints([a,b]);
  const m=new THREE.LineBasicMaterial({color,transparent:true,opacity:0.95});
  const l=new THREE.Line(g,m);scene.add(l);
  effects.push({obj:l,life:0.07,max:0.07,type:'line'});
}
function spawnImpact(pos,color,count,spread){
  spread=spread||1.4;
  for(let i=0;i<count;i++){
    const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:1});
    const m=new THREE.Mesh(IMPACT_GEO,mat);
    m.position.copy(pos);scene.add(m);
    effects.push({obj:m,life:0.32,max:0.32,type:'particle',
      vx:rand(-spread,spread),vy:rand(0.4,2.0),vz:rand(-spread,spread)});
  }
}
function spawnDecal(pos,nx,ny,nz){
  if(!nx&&!ny&&!nz)return;
  const m=new THREE.Mesh(decalGeo,
    new THREE.MeshBasicMaterial({color:0x1a1a2a,transparent:true,opacity:0.85,
      depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4}));
  m.position.set(pos.x+nx*0.012,pos.y+ny*0.012,pos.z+nz*0.012);
  m.lookAt(pos.x+nx*2,pos.y+ny*2,pos.z+nz*2);
  m.rotation.z=Math.random()*Math.PI*2;scene.add(m);
  decals.push({mesh:m,life:14,max:14});
  if(decals.length>70){const o=decals.shift();scene.remove(o.mesh);o.mesh.material.dispose();}
}
function updateEffects(dt){
  for(let i=effects.length-1;i>=0;i--){
    const e=effects[i];e.life-=dt;
    if(e.life<=0){
      scene.remove(e.obj);
      if(e.obj.geometry&&e.obj.geometry!==IMPACT_GEO)e.obj.geometry.dispose();
      if(e.obj.material)e.obj.material.dispose();
      effects.splice(i,1);
    }else{
      const a=e.life/e.max;
      if(e.type==='line')e.obj.material.opacity=a*0.95;
      else if(e.type==='particle'){
        e.vy-=14*dt;e.obj.position.x+=e.vx*dt;e.obj.position.y+=e.vy*dt;
        e.obj.position.z+=e.vz*dt;e.obj.material.opacity=a;
        e.obj.scale.setScalar(1+(1-a)*1.6);
      }else{e.obj.material.opacity=a;e.obj.scale.setScalar(1+(1-a)*2.2);}
    }
  }
  for(let i=decals.length-1;i>=0;i--){
    const d=decals[i];d.life-=dt;
    if(d.life<2)d.mesh.material.opacity=0.85*(d.life/2);
    if(d.life<=0){scene.remove(d.mesh);d.mesh.material.dispose();decals.splice(i,1);}
  }
}

  for(let i=dmgNumbers.length-1;i>=0;i--){
    const d=dmgNumbers[i];d.life-=dt;

    const t=1-d.life/d.max;

    const v=d.worldPos.clone().project(camera);

    d.el.style.display='block';
    const x=(v.x*0.5+0.5)*innerWidth,y=(-v.y*0.5+0.5)*innerHeight;

    d.el.style.transform='translate(-50%,-50%) translate('+x+'px,'+y+'px) scale('+scale.toFixed(2)+')';
    d.el.style.opacity=clamp(d.life/0.35,0,1);
  }
  for(let i=bonusNumbers.length-1;i>=0;i--){
    const d=bonusNumbers[i];d.life-=dt;
    if(d.life<=0){d.el.remove();bonusNumbers.splice(i,1);continue;}
    const t=1-d.life/d.max;
    d.worldPos.y+=dt*0.9;
    const v=d.worldPos.clone().project(camera);
    if(v.z>1||v.z<-1){d.el.style.display='none';continue;}
    d.el.style.display='block';
    const x=(v.x*0.5+0.5)*innerWidth,y=(-v.y*0.5+0.5)*innerHeight;
    d.el.style.transform='translate(-50%,-50%) translate('+x+'px,'+y+'px) scale('+(1+t*0.15).toFixed(2)+')';
    d.el.style.opacity=clamp(d.life/0.5,0,1);
  }
}

/* ---------- COMBAT ---------- */
function damageChar(target,amount,attacker,isHead){
  if(!target.alive||target.spawnProtect>0)return;
  target.health-=amount;
  if(target===player){
    player.regenTimer=0;flashDamage();sfxHurt();
    if(attacker&&attacker!==player){
      const dx=attacker.pos.x-player.pos.x,dz=attacker.pos.z-player.pos.z;
      const worldAngle=Math.atan2(dx,dz);
      let rel=worldAngle-Math.PI-player.yaw;
      while(rel>Math.PI)rel-=Math.PI*2;
      while(rel<-Math.PI)rel+=Math.PI*2;
      showDamageDirection(-rel);
      player.lastKiller=attacker;
    }
  }else if(attacker&&attacker!==target){
    target.lastAttacker=attacker;target.retargetTimer=0;
    target.reactionDelay=Math.min(target.reactionDelay||0.5,0.22);
    if(target.isPlayer===false){
      const dx=attacker.pos.x-target.pos.x,dz=attacker.pos.z-target.pos.z;
      const toAttacker=Math.atan2(dx,dz);
      let diff=toAttacker-target.yaw;
      while(diff>Math.PI)diff-=Math.PI*2;
      while(diff<-Math.PI)diff+=Math.PI*2;
      if(Math.abs(diff)>0.9)target.yaw+=clamp(diff,-6,6);
      /* dodge: getting shot triggers an evasive lateral juke, not a slowdown */
      target.dodgeTimer=0.4+Math.random()*0.25;
      target.strafeDir=Math.random()<0.5?1:-1;
    }
  }
  if(target.health<=0)killChar(target,attacker,isHead);
}
function killChar(target,attacker,isHead){
  target.alive=false;target.health=0;
  if(target.mesh)target.mesh.visible=false;
  if(target.weapon) spawnPickup(target.weapon,target.pos);
  if(target.isPlayer){
    player.deaths++;sfxDeath();
    player.currentStreak=0;
    scopeEl.classList.remove('on');
    /* respawn with new random weapon */
    player.weapon=pick(['pistol','rifle','shotgun','sniper']);
    for(const k in viewModels)viewModels[k].visible=(k===player.weapon);
    if(attacker&&attacker.team!==target.team){
      killerText.textContent='ELIMINATED BY '+attacker.name.toUpperCase()+
        (isHead?' · HEADSHOT':' · '+WEAPONS[attacker.weapon||'pistol'].name);
      startKillcam(attacker);
    }else{
      killerText.textContent='';
      showDeathScreen();
    }
  }else{target.respawn=2.0+Math.random()*1.5;target.deaths++;}
  if(attacker&&attacker.team!==target.team){
    if(attacker.team==='blue')state.blueScore++;else state.redScore++;
    if(attacker===player){
      player.kills++;sfxKill();
      player.currentStreak++;
      if(player.currentStreak>player.bestStreak)player.bestStreak=player.currentStreak;
      const bonusPos=new THREE.Vector3(target.pos.x,target.pos.y+1.6,target.pos.z);
      spawnBonusNumber(bonusPos,'+100');
      const now=performance.now();
      player.recentKills=player.recentKills.filter(t=>now-t<3000);
      player.recentKills.push(now);
      const n=player.recentKills.length;
      if(n===2)announce('DOUBLE KILL');
      else if(n===3)announce('TRIPLE KILL');
      else if(n>=4)announce('MEGA KILL');
    }else{
      attacker.kills++;
    }
  }else{
    if(target.team==='blue')state.redScore++;else state.blueScore++;
  }
  const an=attacker?attacker.name:'the void';
  const at=attacker?attacker.team:'blue';
  const wp=attacker?WEAPONS[attacker.weapon||'pistol'].name:'?';
  addKillFeed(an,at,target.name,target.team,isHead?'HEADSHOT':wp);
}
function respawnChar(c){
  const list=SPAWNS[c.team];let sp=pick(list);
  for(let i=0;i<6;i++){
    const test=pick(list);let ok=true;
    for(const o of chars){
      if(o===c||!o.alive||o.spawnProtect>0)continue;
      const dx=o.pos.x-test[0],dz=o.pos.z-test[2];
      if(dx*dx+dz*dz<36){ok=false;break;}
    }
    if(ok){sp=test;break;}
  }
  c.pos.set(sp[0]+rand(-2,2),0,sp[2]+rand(-2,2));
  c.vel.set(0,0,0);c.health=100;c.alive=true;
  c.reloading=0;c.fireCd=0.4;c.spawnProtect=2.0;
  c.switchState='idle';c.switchT=0;c.pendingWeapon=null;
  c.crouching=false;
  if(c===player){
    c.eyeHeight=EYE_HEIGHT;c.zoom=false;
    c.swayX=0;c.swayY=0;c.camRecoilPitch=0;c.camRecoilYaw=0;c.recoilVM=0;
    c.idleTime=0;c.bob=0;c.landDip=0;c.coyote=0;
    c.sliding=false;c.slideTime=0;c.slideCooldown=0;
    c.inertia=0;c.jumpBuffer=0;c.jumpBuffered=false;
    c.slideFovKick=0;
  }
  if(c.ammo)for(const k in c.ammo)c.ammo[k]=WEAPONS[k].mag;
  if(c.wanderTarget)c.wanderTarget.set(0,0,0);
  if(c.mesh){c.mesh.visible=true;c.mesh.position.copy(c.pos);}
}
const _dir=new THREE.Vector3(),_origin=new THREE.Vector3();
function muzzleFlash(){flashTimer=0.06;flashMat.opacity=0.95;flashMesh.scale.setScalar(1);
  muzzleLight.intensity=3.2;}
function playerShoot(){
  if(!player.alive)return;
  if(player.switchState!=='idle')return;
  if(deathScreenEl.classList.contains('on'))return;
  const w=WEAPONS[player.weapon];
  if(player.fireCd>0||player.reloading>0)return;
  if(player.ammo[player.weapon]<=0){startReload();return;}
  player.ammo[player.weapon]--;
  player.shotsFired+=w.pellets;
  player.fireCd=w.delay;
  player.recoilVM=Math.min(player.recoilVM+w.kickVM*0.04,0.26);
  player.camRecoilPitch+=w.recoilPitch;
  player.camRecoilYaw+=rand(-1,1)*w.recoilYaw;
  sfxShot(player.weapon,0.22);muzzleFlash();
  spawnCasing();
  for(const b of bots){
    if(!b.alive||b.team===player.team)continue;
    const dx=b.pos.x-player.pos.x,dz=b.pos.z-player.pos.z;
    const d=Math.sqrt(dx*dx+dz*dz);
    if(d<44){b.alertTimer=3.0;b.alertPos={x:player.pos.x,z:player.pos.z};}
  }
  _origin.set(player.pos.x,player.pos.y+player.eyeHeight,player.pos.z);
  const hitsByTarget=new Map();
  for(let p=0;p<w.pellets;p++){
    camera.getWorldDirection(_dir);
    const sp=w.spread*(player.zoom?0.22:1)*(player.crouching?0.7:1)*(1+player.recoilVM*0.6);
    _dir.x+=rand(-sp,sp);_dir.y+=rand(-sp,sp);_dir.z+=rand(-sp,sp);
    _dir.normalize();
    const wall=raycastWorldN(_origin.x,_origin.y,_origin.z,_dir.x,_dir.y,_dir.z,w.range);
    const hit=raycastChars(_origin.x,_origin.y,_origin.z,_dir.x,_dir.y,_dir.z,
                           Math.min(wall.dist,w.range),player);
    const dd=hit?hit.dist:wall.dist;
    const end=new THREE.Vector3(_origin.x+_dir.x*dd,_origin.y+_dir.y*dd,_origin.z+_dir.z*dd);
    if(p===0){
      const tc=player.team==='blue'?0x66c2ff:0xff96a8;
      spawnTracer(_origin.clone().addScaledVector(_dir,0.7),end,tc);
    }
    if(hit){
      let dmg=w.dmg;
      if(hit.head)dmg*=2.1;
      if(player.weapon==='shotgun')dmg*=clamp(1-hit.dist/(w.range*1.4),0.35,1);
      const key=hit.char.id;
      const ex=hitsByTarget.get(key);
      if(ex){ex.total+=dmg;if(hit.head)ex.isHead=true;}
      else hitsByTarget.set(key,{total:dmg,isHead:hit.head,char:hit.char,pos:end.clone()});
      damageChar(hit.char,dmg,player,hit.head);
      spawnImpact(end,0xff5a6e,5,1.1);
      player.shotsHit++;
      if(hit.head)player.headshots++;
      lastHitEnemy=hit.char;lastHitTime=performance.now();
    }else if(wall.hit&&wall.dist<w.range){
      spawnImpact(end,0xd8c7a6,6,1.4);
      spawnDecal(end,wall.nx,wall.ny,wall.nz);
    }
  }
  for(const e of hitsByTarget.values()){
    spawnDamageNumber(e.pos,Math.round(e.total),e.isHead,!e.char.alive);
    if(e.isHead)sfxHead();else sfxHit();
    showHitmarker(!e.char.alive);
  }
  if(player.ammo[player.weapon]<=0)startReload();
}
function startReload(){
  if(!player.alive)return;
  const w=WEAPONS[player.weapon];
  if(player.reloading>0)return;
  if(player.switchState!=='idle')return;
  if(player.ammo[player.weapon]>=w.mag)return;
  player.reloading=w.reload;sfxReload();
}
function switchWeapon(name){
  if(!player.alive)return;
  if(player.switchState!=='idle')return;
  if(player.weapon===name)return;
  player.pendingWeapon=name;
  player.switchState='lower';player.switchT=0;
  player.reloading=0;sfxSwitch();
}

/* ---------- BOT AI (nerfed aim) ---------- */
const PERSONALITIES={
  rusher :{preferred:6,aggressive:true,retreatHP:15,turnSpeed:8,weapon:'shotgun'},
  soldier:{preferred:14,aggressive:false,retreatHP:35,turnSpeed:6,weapon:'rifle'},
  sniper :{preferred:32,aggressive:false,retreatHP:45,turnSpeed:5,weapon:'sniper'},
  scout  :{preferred:10,aggressive:true,retreatHP:25,turnSpeed:9,weapon:'pistol'}
};
function makeBot(team,name,cfg,personalityName){
  const p=PERSONALITIES[personalityName||pick(['rusher','soldier','sniper','scout'])];
  const mesh=buildCat({fur:cfg.fur,accent:cfg.accent,eye:cfg.eye,team});
  mesh.rotation.order='YXZ';
  const weaponMount=new THREE.Group();
  weaponMount.position.set(0.34,1.28,0.34);
  mesh.add(weaponMount);
  const bot={
    id:nextId++,isPlayer:false,name,team,mesh,weaponMount,
    pos:new THREE.Vector3(),vel:new THREE.Vector3(),
    yaw:0,health:100,alive:true,onGround:true,
    weapon:p.weapon,fireCd:rand(0.5,1.5),reloading:0,ammo:WEAPONS[p.weapon].mag,
    target:null,retargetTimer:0,lastAttacker:null,
    reactionDelay:rand(0.28,0.7),aimTime:0,
    strafeDir:Math.random()<0.5?1:-1,strafeTimer:0,
    stuckTimer:0,wanderTarget:new THREE.Vector3(),
    respawn:0,kills:0,deaths:0,walkPhase:Math.random()*6,
    spawnProtect:0,personality:p,alertTimer:0,alertPos:null,
    sharedTarget:null,sharedTargetTime:0,retreating:false,
    blinkTimer:rand(2.5,5.5),blinkPhase:0,
    twitchTimer:rand(3,8),twitchPhase:0,
    flinchTime:0,dodgeTimer:0
  };
  bot.wpnMesh=buildWeapon(bot.weapon);weaponMount.add(bot.wpnMesh);
  return bot;
}
function updateBot(bot,dt){
  if(bot.spawnProtect>0)bot.spawnProtect-=dt;
  if(bot.alertTimer>0)bot.alertTimer-=dt;
  if(bot.sharedTargetTime>0)bot.sharedTargetTime-=dt;
  if(bot.flinchTime>0)bot.flinchTime-=dt;
  if(bot.dodgeTimer>0)bot.dodgeTimer-=dt;
  bot.blinkTimer-=dt;
  if(bot.blinkTimer<=0){bot.blinkTimer=rand(2.5,5.5);bot.blinkPhase=0.15;}
  if(bot.blinkPhase>0){
    bot.blinkPhase-=dt;
    const p=1-Math.abs(bot.blinkPhase/0.15-0.5)*2;
    const squash=1-p*0.9;
    bot.mesh.userData.eyes.forEach(e=>e.scale.y=squash);
  }else bot.mesh.userData.eyes.forEach(e=>e.scale.y=1);
  bot.twitchTimer-=dt;
  if(bot.twitchTimer<=0){bot.twitchTimer=rand(3,8);bot.twitchPhase=0.2;}
  if(bot.twitchPhase>0){
    bot.twitchPhase-=dt;
    const p=1-Math.abs(bot.twitchPhase/0.2-0.5)*2;
    const tw=p*0.35;
    bot.mesh.userData.ears.forEach((ear,i)=>{
      ear.rotation.z=ear.userData.baseRotZ+(i?tw:-tw);
    });
  }else{
    bot.mesh.userData.ears.forEach(ear=>{ear.rotation.z=ear.userData.baseRotZ;});
  }
  if(!bot.alive){
    bot.respawn-=dt;
    if(bot.respawn<=0)respawnChar(bot);
    return;
  }
  bot.fireCd-=dt;
  if(bot.reloading>0){
    bot.reloading-=dt;
    if(bot.reloading<=0)bot.ammo=WEAPONS[bot.weapon].mag;
  }
  bot.retargetTimer-=dt;
  if(bot.retargetTimer<=0||!bot.target||!bot.target.alive){
    bot.retargetTimer=0.35;
    let best=null,bestD=Infinity;
    for(const c of chars){
      if(!c.alive||c.team===bot.team||c.spawnProtect>0)continue;
      const dx=c.pos.x-bot.pos.x,dz=c.pos.z-bot.pos.z;
      const d=dx*dx+dz*dz;
      const dist=Math.sqrt(d);
      const stealthRange = c.isPlayer&&c.crouching ? 55 : 100;
      const stealthDot   = c.isPlayer&&c.crouching ? 0.62 : 0.40;
      if(dist>stealthRange) continue;
      const forwardX=Math.sin(bot.yaw),forwardZ=Math.cos(bot.yaw);
      const dot=(forwardX*dx+forwardZ*dz)/(dist||1);
      const inFov=dot>stealthDot;
      const hasLOSC=hasLOS(bot.pos.x,bot.pos.y+1.4,bot.pos.z,c.pos.x,c.pos.y+1.2,c.pos.z);
      if(inFov&&hasLOSC){
        let popularity=0;
        for(const other of bots){
          if(other===bot||other.team!==bot.team||!other.alive)continue;
          if(other.target===c) popularity++;
        }
        const adjustedD=d + popularity*900;
        if(adjustedD<bestD){bestD=adjustedD;best=c;}
      }
    }
    if(!best&&bot.sharedTarget&&bot.sharedTarget.alive&&bot.sharedTargetTime>0)best=bot.sharedTarget;
    if(best!==bot.target){
      bot.target=best;bot.aimTime=0;bot.reactionDelay=rand(0.28,0.7);
      if(best){
        for(const other of bots){
          if(other===bot||other.team!==bot.team||!other.alive)continue;
          if(other.target) continue;
          if(other.pos.distanceTo(bot.pos)<14){other.sharedTarget=best;other.sharedTargetTime=1.5;}
        }
      }
    }
  }
  const w=WEAPONS[bot.weapon];const p=bot.personality;
  let moveX=0,moveZ=0,aiming=false;
  let desiredRange=p.preferred;
  bot.retreating=false;
  if(bot.health<p.retreatHP){desiredRange*=2.2;bot.retreating=true;}
  if(bot.target&&bot.target.alive){
    const t=bot.target;
    const dx=t.pos.x-bot.pos.x,dz=t.pos.z-bot.pos.z;
    const dist=Math.sqrt(dx*dx+dz*dz);
    const wantYaw=Math.atan2(dx,dz);
    let diff=wantYaw-bot.yaw;
    while(diff>Math.PI)diff-=Math.PI*2;
    while(diff<-Math.PI)diff+=Math.PI*2;
    const ts=p.turnSpeed;
    bot.yaw+=clamp(diff,-ts*dt,ts*dt);
    aiming=Math.abs(diff)<0.28;
    if(dist>desiredRange+3){
      moveX=dx/dist;moveZ=dz/dist;
      /* juke while closing distance so bots don't run straight into the crosshair */
      const juke=Math.sin(performance.now()*0.004+bot.id)*(p.aggressive?0.35:0.18);
      const perpX=-dz/dist,perpZ=dx/dist;
      moveX+=perpX*juke;moveZ+=perpZ*juke;
      const mlen=Math.hypot(moveX,moveZ)||1;moveX/=mlen;moveZ/=mlen;
    }
    else if(dist<desiredRange-3){
      moveX=-dx/dist;moveZ=-dz/dist;
      if(bot.retreating){
        /* don't just backpedal in a straight line — drift laterally too */
        const perpX=-dz/dist,perpZ=dx/dist;
        const bias=Math.sin(performance.now()*0.003+bot.id*1.7)*0.5;
        moveX+=perpX*bias;moveZ+=perpZ*bias;
        const mlen=Math.hypot(moveX,moveZ)||1;moveX/=mlen;moveZ/=mlen;
      }
    }
    else{
      bot.strafeTimer-=dt;
      if(bot.strafeTimer<=0){bot.strafeTimer=rand(0.7,1.8);bot.strafeDir*=-1;}
      moveX=-dz/dist*bot.strafeDir;moveZ=dx/dist*bot.strafeDir;
    }
    if(bot.dodgeTimer>0){
      /* reactive dodge burst from just getting shot — blends into whatever they're already doing */
      const perpX=Math.cos(bot.yaw),perpZ=-Math.sin(bot.yaw);
      const k=0.85*Math.min(1,bot.dodgeTimer/0.5);
      moveX+=perpX*bot.strafeDir*k;moveZ+=perpZ*bot.strafeDir*k;
      const mlen=Math.hypot(moveX,moveZ)||1;moveX/=mlen;moveZ/=mlen;
    }
    const eyeY=bot.pos.y+1.5,tEyeY=t.pos.y+1.15;
    const los=hasLOS(bot.pos.x,eyeY,bot.pos.z,t.pos.x,tEyeY,t.pos.z);
    if(los&&aiming)bot.aimTime+=dt;else bot.aimTime=0;
    if(los&&aiming&&bot.aimTime>bot.reactionDelay&&bot.fireCd<=0
       &&bot.reloading<=0&&bot.ammo>0&&dist<w.range&&bot.flinchTime<=0){
      bot.ammo--;
      bot.fireCd=w.auto? w.delay*rand(1.05,1.35) : w.delay*rand(1.15,1.75);
      if(bot.ammo<=0)bot.reloading=w.reload;
      sfxShot(bot.weapon,0.09);
      const aimError=0.62+dist*0.055+(bot.retreating?0.9:0)
                    +(p.aggressive?-0.08:0.25);
      const missX=rand(-aimError,aimError);
      const missY=rand(-aimError,aimError);
      const missZ=rand(-aimError,aimError);
      const muzzle=new THREE.Vector3(bot.pos.x,eyeY,bot.pos.z);
      /* lead moving targets — snipers/soldiers track better than rushers/scouts */
      const leadSkill=p.preferred>20?0.85:p.preferred<8?0.25:0.55;
      const leadTime=clamp(dist/38,0,0.4)*leadSkill;
      const leadX=t.vel?t.vel.x*leadTime:0;
      const leadZ=t.vel?t.vel.z*leadTime:0;
      const aimPt=new THREE.Vector3(t.pos.x+leadX+missX,tEyeY+missY,t.pos.z+leadZ+missZ);
      const tc=bot.team==='blue'?0x66c2ff:0xff96a8;
      spawnTracer(muzzle,aimPt,tc);
      const distFactor=dist/w.range;
      const baseAcc=clamp(1-distFactor*2.6,0.02,0.36);
      const sustainBonus=Math.min(bot.aimTime*0.10,0.15);
      const retreatPenalty=bot.retreating?0.35:1;
      const personalityMod=p.preferred>20?1.1:p.preferred<8?0.65:0.9;
      const acc=clamp((baseAcc+sustainBonus)*retreatPenalty*personalityMod,0.02,0.42)
               *(w.pellets>1?0.5:1);
      if(Math.random()<acc){
        let dmg=w.dmg*(w.pellets>1?rand(1.5,3.5):rand(0.65,1.0));
        const head=Math.random()<0.06;
        if(head)dmg*=1.8;
        damageChar(t,dmg,bot,head);
        if(t===player)showHitmarker(false);
      }
    }
  }else{
    let tx,tz;
    if(bot.alertTimer>0&&bot.alertPos){tx=bot.alertPos.x;tz=bot.alertPos.z;}
    else if(bot.lastAttacker&&bot.lastAttacker.alive){tx=bot.lastAttacker.pos.x;tz=bot.lastAttacker.pos.z;}
    else{
      if(bot.wanderTarget.lengthSq()===0||bot.pos.distanceToSquared(bot.wanderTarget)<8){
        if(bot.personality===PERSONALITIES.sniper && Math.random()<0.55){
          const t=TOWER_POSITIONS[Math.floor(Math.random()*TOWER_POSITIONS.length)];
          bot.wanderTarget.set(t.x,0,t.z);
        } else {
          bot.wanderTarget.set(rand(-60,60),0,rand(-60,60));
        }
      }
      tx=bot.wanderTarget.x;tz=bot.wanderTarget.z;
    }
    const dx=tx-bot.pos.x,dz=tz-bot.pos.z;
    const d=Math.sqrt(dx*dx+dz*dz)||1;
    moveX=dx/d;moveZ=dz/d;
    const wantYaw=Math.atan2(dx,dz);
    let diff=wantYaw-bot.yaw;
    while(diff>Math.PI)diff-=Math.PI*2;
    while(diff<-Math.PI)diff+=Math.PI*2;
    bot.yaw+=clamp(diff,-5*dt,5*dt);
    if(bot.ammo<w.mag&&bot.reloading<=0)bot.reloading=w.reload*0.6;
  }
  const flinchMul=bot.flinchTime>0?0.45:1;
  const speed=6.4*(p.aggressive?1.05:0.95)*(bot.retreating?1.1:1)*flinchMul;
  const prevX=bot.pos.x,prevZ=bot.pos.z;
  bot.vel.x=moveX*speed;bot.vel.z=moveZ*speed;
  const g=moveWithCollisions(bot.pos,bot.vel,CHAR_RADIUS,CHAR_HEIGHT,dt);
  bot.onGround=g.onGround;
  if(tryJumpPad(bot)){bot.flinchTime=0.25;bot.strafeTimer=0.4;}
  const moved=Math.hypot(bot.pos.x-prevX,bot.pos.z-prevZ);
  const wanted=speed*dt;
  if(wanted>0.01&&moved<wanted*0.35){
    bot.stuckTimer+=dt;
    if(bot.stuckTimer>0.25){
      bot.stuckTimer=0;bot.yaw+=rand(-1.6,1.6);
      bot.wanderTarget.set(bot.pos.x+rand(-16,16),0,bot.pos.z+rand(-16,16));
    }
  }else bot.stuckTimer=0;
  bot.pos.x=clamp(bot.pos.x,-63,63);
  bot.pos.z=clamp(bot.pos.z,-63,63);
  if(bot.onGround&&Math.random()<0.008)bot.vel.y=JUMP_VEL*0.85;
  bot.mesh.position.copy(bot.pos);
  bot.mesh.rotation.y=bot.yaw;
  const spd=Math.hypot(bot.vel.x,bot.vel.z);
  bot.walkPhase+=dt*spd*2.2;
  bot.mesh.userData.tail.rotation.y=Math.sin(performance.now()*0.002)*0.3;
  bot.mesh.userData.tail.rotation.x=Math.sin(performance.now()*0.0015)*0.12;
  const armTarget=aiming?-1.15:-0.35;
  const walkSwing=0.4*Math.sin(bot.walkPhase)*Math.min(spd/6,1)*(aiming?0.25:1);
  bot.mesh.userData.arms[0].rotation.x=lerp(bot.mesh.userData.arms[0].rotation.x,armTarget+walkSwing,dt*8);
  bot.mesh.userData.arms[1].rotation.x=lerp(bot.mesh.userData.arms[1].rotation.x,armTarget-walkSwing,dt*8);
  bot.mesh.rotation.z=Math.sin(bot.walkPhase)*0.05*Math.min(spd/6,1);
  bot.mesh.rotation.x=lerp(bot.mesh.rotation.x, bot.flinchTime>0?0.18:0, dt*10);
}

/* ---------- JUMP PADS ---------- */
function tickJumpPads(dt){
  const now=performance.now()*0.001;
  for(let i=0;i<jumpPads.length;i++){
    const pad=jumpPads[i];
    pad.cooldown=Math.max(0,pad.cooldown-dt);
    pad.arrow.position.y=pad.baseArrowY+Math.sin(now*4+i)*0.18;
    pad.arrow.rotation.y+=dt*1.6;
    pad.ring.rotation.z+=dt*0.9;
    pad.ring.scale.setScalar(1+Math.sin(now*3+i*0.7)*0.04);
  }
}
function tryJumpPad(entity){
  if(!entity.alive) return false;
  if(entity.pos.y > 1.4) return false;
  if(entity.vel.y > 3) return false;
  for(let i=0;i<jumpPads.length;i++){
    const pad=jumpPads[i];
    if(pad.cooldown>0) continue;
    const dx=entity.pos.x-pad.x, dz=entity.pos.z-pad.z;
    if(dx*dx+dz*dz < pad.r2){
      entity.vel.y = pad.power;
      entity.onGround = false;
      pad.cooldown = 0.35;
      return true;
    }
  }
  return false;
}

/* ---------- PLAYER UPDATE ---------- */
function updatePlayer(dt){
  if(player.spawnProtect>0)player.spawnProtect-=dt;
  if(player.alive&&player.health<30&&player.health>0){
    heartTimer-=dt;
    if(heartTimer<=0){heartTimer=1.1;sfxHeart();}
  }else heartTimer=0;
  if(!player.alive)return;
  if(player.health<100){
    player.regenTimer+=dt;
    if(player.regenTimer>4.0)player.health=Math.min(100,player.health+22*dt);
  }
  player.fireCd-=dt;
  if(player.reloading>0){
    player.reloading-=dt;
    if(player.reloading<=0){
      player.ammo[player.weapon]=WEAPONS[player.weapon].mag;
      sfxTone(520,0.07,'square',0.05);
    }
  }
  if(player.switchState==='lower'){
    player.switchT+=dt/WEAPONS[player.weapon].switchOut;
    if(player.switchT>=1){
      player.switchT=0;player.switchState='raise';
      player.weapon=player.pendingWeapon;player.pendingWeapon=null;
      for(const k in viewModels)viewModels[k].visible=(k===player.weapon);
    }
  }else if(player.switchState==='raise'){
    player.switchT+=dt/WEAPONS[player.weapon].switchIn;
    if(player.switchT>=1){player.switchT=0;player.switchState='idle';}
  }
  player.crouching=!!(keys['ControlLeft']||keys['ControlRight']);
  const eyeTarget=player.crouching?EYE_CROUCH:EYE_HEIGHT;
  player.eyeHeight=lerp(player.eyeHeight,eyeTarget,dt*12);
  let fx=0,fz=0;
  const fwd=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
  const right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
  if(keys['KeyW']){fx+=fwd.x;fz+=fwd.z;}
  if(keys['KeyS']){fx-=fwd.x;fz-=fwd.z;}
  if(keys['KeyD']){fx+=right.x;fz+=right.z;}
  if(keys['KeyA']){fx-=right.x;fz-=right.z;}
  const len=Math.hypot(fx,fz);
  if(len>0){fx/=len;fz/=len;}
  const sprinting=(keys['ShiftLeft']||keys['ShiftRight'])&&len>0&&!player.zoom&&!player.crouching;
  let speed=PLAYER_SPEED*(sprinting?SPRINT_MULT:1)*(player.zoom?0.42:1);
  if(player.crouching)speed*=0.55;
  player.slideCooldown=Math.max(0,player.slideCooldown-dt);
  if(player.sliding){
    player.slideTime-=dt;
    if(player.slideTime<=0||!player.onGround){
      player.sliding=false;player.slideCooldown=SLIDE_COOLDOWN;
    }
  }
  const currentSpeed=Math.hypot(player.vel.x,player.vel.z);
  if(!player.sliding && player.crouching && sprinting && player.onGround
     && currentSpeed>SLIDE_MIN_SPEED && player.slideCooldown<=0){
    player.sliding=true;player.slideTime=SLIDE_DURATION;
    if(len>0){player.vel.x=fx*SLIDE_BOOST;player.vel.z=fz*SLIDE_BOOST;}
    else{
      const dx=player.vel.x,dz=player.vel.z;
      const d=Math.hypot(dx,dz)||1;
      player.vel.x=(dx/d)*SLIDE_BOOST;player.vel.z=(dz/d)*SLIDE_BOOST;
    }
    sfxSlide();
  }
  const targetVx=fx*speed,targetVz=fz*speed;
  const hasInput=len>0;
  let rate;
  if(player.sliding) rate=1.2;
  else if(player.onGround) rate=hasInput?11:6;
  else rate=hasInput?4.5:1.2;
  const k=1-Math.exp(-rate*dt);
  player.vel.x=player.vel.x+(targetVx-player.vel.x)*k;
  player.vel.z=player.vel.z+(targetVz-player.vel.z)*k;
  if(player.onGround)player.coyote=0.12;
  else if(player.coyote>0)player.coyote-=dt;
  if(keys['Space']){player.jumpBuffer=JUMP_BUFFER_TIME;player.jumpBuffered=true;}
  else player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);
  if(player.jumpBuffered && player.coyote>0 && !player.zoom && !player.crouching){
    player.vel.y=JUMP_VEL;player.onGround=false;player.coyote=0;
    player.jumpBuffered=false;player.jumpBuffer=0;
    if(player.sliding){player.sliding=false;player.slideCooldown=SLIDE_COOLDOWN*0.5;}
  }
  if(player.jumpBuffer<=0) player.jumpBuffered=false;
  const preVelY=player.vel.y;
  const wasGround=player.onGround;
  const g=moveWithCollisions(player.pos,player.vel,CHAR_RADIUS,CHAR_HEIGHT,dt);
  player.onGround=g.onGround;
  if(!wasGround && player.onGround && preVelY<-6){
    player.landDip=Math.min(0.16,Math.abs(preVelY)*0.012);
    player.inertia=INERTIA_TIME;
  }
  if(player.inertia>0)player.inertia=Math.max(0,player.inertia-dt);
  if(player.onGround&&len>0&&!player.sliding){
    player.stepTimer-=dt*(sprinting?1.5:1);
    if(player.stepTimer<=0){
      player.stepTimer=sprinting?0.30:0.42;
      player.stepSide*=-1;
      sfxStep(g.tag==='stone');
    }
  }else player.stepTimer=0;
  if(tryJumpPad(player)){
    sfxJumpPad();
    player.camRecoilPitch-=0.08;
    player.slideFovKick=0.5;
  }
  if(mouseDown&&WEAPONS[player.weapon].auto&&player.fireCd<=0
     &&player.reloading<=0&&player.switchState==='idle'){
    playerShoot();
  }
  const moving=len>0&&player.onGround;
  player.bob+=dt*(moving?(sprinting?14:10):0);
  if(!moving&&player.onGround&&!player.zoom)player.idleTime+=dt;
  else player.idleTime=0;
  const idleSwayX=Math.sin(player.idleTime*1.5)*0.008;
  const idleSwayY=Math.sin(player.idleTime*1.5+1.2)*0.006;
  const idleRoll=Math.sin(player.idleTime*0.9)*0.008;
  const bobY=moving?Math.sin(player.bob)*0.045:0;
  const bobX=moving?Math.cos(player.bob*0.5)*0.03:0;
  player.landDip=lerp(player.landDip,0,dt*6);
  const recRate=9;
  player.camRecoilPitch*=Math.exp(-dt*recRate);
  player.camRecoilYaw*=Math.exp(-dt*recRate);
  if(player.sliding)player.eyeHeight=lerp(player.eyeHeight,EYE_SLIDE,dt*14);
  camera.position.set(
    player.pos.x+bobX*0.4+idleSwayX,
    player.pos.y+player.eyeHeight+bobY-player.landDip+idleSwayY,
    player.pos.z
  );
  camera.rotation.y=player.yaw+player.camRecoilYaw;
  camera.rotation.x=clamp(player.pitch+player.camRecoilPitch,-Math.PI/2+0.02,Math.PI/2-0.02);
  camera.rotation.z=bobX*0.03+idleRoll*0.6+(player.sliding?0.06:0);
  const w=WEAPONS[player.weapon];
  const spd=Math.hypot(player.vel.x,player.vel.z);
  const sprintBonus=Math.min(spd/PLAYER_SPEED,1)*4;
  player.slideFovKick=Math.max(0,player.slideFovKick-dt*2.5);
  const fovKick=player.slideFovKick*6;
  const baseFov=player.zoom?settings.fov/w.zoom:(settings.fov+sprintBonus+fovKick);
  camera.fov=lerp(camera.fov,baseFov,dt*12);
  camera.updateProjectionMatrix();
  player.swayX=lerp(player.swayX,0,dt*7);
  player.swayY=lerp(player.swayY,0,dt*7);
  player.recoilVM=Math.max(0,player.recoilVM-dt*1.6);
  let reloadDipY=0,reloadRotX=0;
  if(player.reloading>0){
    const rw=WEAPONS[player.weapon];
    const t=1-player.reloading/rw.reload;
    const dip=Math.sin(t*Math.PI);
    reloadDipY=-dip*0.28;reloadRotX=dip*0.95;
  }
  let switchY=0,switchRot=0;
  if(player.switchState==='lower'){const t=player.switchT;switchY=-t*0.42;switchRot=t*0.9;}
  else if(player.switchState==='raise'){const t=1-player.switchT;switchY=-t*0.42;switchRot=t*0.9;}
  const swayX=moving?Math.sin(player.bob)*0.012:0;
  const swayY=moving?Math.abs(Math.cos(player.bob))*0.010:0;
  viewModelRoot.position.x=lerp(viewModelRoot.position.x,0.28+swayX+player.swayX,dt*10);
  viewModelRoot.position.y=lerp(viewModelRoot.position.y,
    -0.30+swayY+player.recoilVM*0.6+player.swayY+reloadDipY+switchY,dt*14);
  viewModelRoot.position.z=lerp(viewModelRoot.position.z,-0.55+player.recoilVM*0.9,dt*14);
  viewModelRoot.rotation.x=lerp(viewModelRoot.rotation.x,
    player.recoilVM*1.4+reloadRotX+switchRot,dt*14);
  viewModelRoot.rotation.z=player.swayX*2.6;
  viewModelRoot.visible=!(player.zoom&&player.weapon==='sniper');
  if(flashTimer>0){
    flashTimer-=dt;
    flashMat.opacity=Math.max(0,flashTimer/0.06);
    flashMesh.scale.setScalar(1+(1-flashTimer/0.06)*1.5);
  }else flashMat.opacity=0;
  muzzleLight.intensity*=Math.exp(-dt*28);
  if(dmgDirTimer>0){
    dmgDirTimer-=dt;
    if(dmgDirTimer<=0)dmgDirEl.classList.remove('on');
    else if(dmgDirTimer<0.4)dmgDirEl.style.opacity=String(dmgDirTimer/0.4);
    else dmgDirEl.style.opacity='1';
  }
  updateCrosshair(dt);
}

/* ---------- FLOW ---------- */
function startMatch(){
  for(const b of bots)scene.remove(b.mesh);
  bots.length=0;chars.length=0;chars.push(player);
  for(const pad of jumpPads)pad.cooldown=0;
  clearPickups();clearCasings();
  for(let i=dmgNumbers.length-1;i>=0;i--){dmgNumbers[i].el.remove();}
  dmgNumbers.length=0;
  for(let i=bonusNumbers.length-1;i>=0;i--){bonusNumbers[i].el.remove();}
  bonusNumbers.length=0;
  snapshotBuffer.length=0;nextSnapshotAt=0;
  killcam.active=false;$('killcam').classList.remove('on');
  hideDeathScreen();
  state.blueScore=0;state.redScore=0;state.timeLeft=300;state.over=false;
  state.killsToWin=state.mode*10;
  player.name=state.name||'You';player.team=state.team;
  player.kills=0;player.deaths=0;player.health=100;player.alive=true;
  for(const k in player.ammo)player.ammo[k]=WEAPONS[k].mag;
  player.reloading=0;player.fireCd=0;player.zoom=false;
  player.recentKills=[];player.spawnProtect=0;
  player.weapon=pick(['pistol','rifle','shotgun','sniper']);
  player.switchState='idle';player.switchT=0;
  player.camRecoilPitch=0;player.camRecoilYaw=0;player.recoilVM=0;
  player.shotsFired=0;player.shotsHit=0;player.headshots=0;
  player.currentStreak=0;player.bestStreak=0;
  player.pendingWeapon=null;
  player.sliding=false;player.slideTime=0;player.slideCooldown=0;
  player.inertia=0;player.jumpBuffer=0;player.jumpBuffered=false;
  player.slideFovKick=0;
  respawnChar(player);
  player.yaw=state.team==='blue'?Math.PI:0;player.pitch=0;
  for(const k in viewModels)viewModels[k].visible=(k===player.weapon);
  /* initial gun spawns on the ground */
  const GUN_TYPES=['pistol','rifle','shotgun','sniper'];
  const INITIAL_GUNS=[
    [-15,0],[15,0],[0,-15],[0,15],
    [-15,-15],[15,15],[-15,15],[15,-15]
  ];
  INITIAL_GUNS.forEach(sp=>{spawnPickup(pick(GUN_TYPES),{x:sp[0],z:sp[1]});});
  const enemyTeam=state.team==='blue'?'red':'blue';
  const pool=NAMES.slice().sort(()=>Math.random()-0.5);
  const furPool=['#f0a03c','#ff5a3c','#4db4ff','#ffd93d','#b28dff','#3ee08a',
                 '#ff6b9d','#ffffff','#7a5c48','#b0a8c0'];
  const teammates=state.mode-1;
  const enemies=state.mode;
  const teammatePers=['soldier','scout','rusher'];
  for(let i=0;i<teammates;i++){
    const b=makeBot(state.team,pool[i],
      {fur:furPool[(i*2)%furPool.length],accent:'#fff2dd',eye:'#0a0a12'},
      teammatePers[i%teammatePers.length]);
    bots.push(b);chars.push(b);
  }
  const enemyPers=['rusher','soldier','sniper','scout'];
  for(let i=0;i<enemies;i++){
    const b=makeBot(enemyTeam,pool[3+i],
      {fur:furPool[(i*3+1)%furPool.length],accent:'#fff2dd',eye:'#0a0a12'},
      enemyPers[i%enemyPers.length]);
    bots.push(b);chars.push(b);
  }
  bots.forEach(b=>{b.ammo=WEAPONS[b.weapon].mag;respawnChar(b);scene.add(b.mesh);});
  for(const k in markers){markers[k].remove();delete markers[k];}
  killfeed.innerHTML='';
  hud.classList.add('on');
  $('end').classList.remove('on');
  $('pause').classList.remove('on');
  $('settings').classList.remove('on');
  crosshair.classList.remove('hit','kill');
  lowHPEl.classList.remove('on');
  lastHitEnemy=null;lastHitTime=0;
  state.running=true;lastTime=performance.now();
}
function endMatch(){
  state.running=false;state.over=true;
  hideDeathScreen();
  if(document.pointerLockElement)document.exitPointerLock();
  const win=state.blueScore===state.redScore?'DRAW'
          :(state.blueScore>state.redScore?'BLUE WINS':'RED WINS');
  const mine=state.team==='blue'?state.blueScore:state.redScore;
  const theirs=state.team==='blue'?state.redScore:state.blueScore;
  const t=$('endTitle');
  if(win==='DRAW'){t.textContent='DRAW';t.style.color='#ffd93d';}
  else if((win==='BLUE WINS')===(state.team==='blue')){t.textContent='VICTORY';t.style.color='#4db4ff';}
  else{t.textContent='DEFEAT';t.style.color='#ff4d5a';}
  const acc=player.shotsFired>0?Math.round(player.shotsHit/player.shotsFired*100):0;
  $('endStats').innerHTML=
    '<span>SCORE</span><span>'+mine+' — '+theirs+'</span>'+
    '<span>KILLS</span><span>'+player.kills+'</span>'+
    '<span>DEATHS</span><span>'+player.deaths+'</span>'+
    '<span>K / D</span><span>'+(player.deaths>0?(player.kills/player.deaths).toFixed(2):player.kills.toFixed(2))+'</span>'+
    '<span>ACCURACY</span><span>'+acc+'%</span>'+
    '<span>HEADSHOTS</span><span>'+player.headshots+'</span>'+
    '<span>BEST STREAK</span><span>'+player.bestStreak+'</span>';
  $('end').classList.add('on');
  hud.classList.remove('on');
  scoreboard.classList.remove('on');
  scopeEl.classList.remove('on');
  lowHPEl.classList.remove('on');
  enemyTagEl.style.display='none';
  enemyHPBar.style.display='none';
  for(const k in markers)markers[k].style.display='none';
}

let leaderboardRefreshTimer=0;
let minimapTimer=0;
let fpsFrames=0, fpsAccum=0;
const fpsEl=document.createElement('div');
fpsEl.style.cssText='position:fixed;top:8px;left:8px;background:rgba(0,0,0,.65);'+
  'color:#0f0;font:bold 12px monospace;padding:4px 8px;border-radius:4px;'+
  'z-index:9999;display:none;pointer-events:none;';

let showFps=false;
function update(dt){
  state.timeLeft-=dt;
  if(state.timeLeft<=0){state.timeLeft=0;endMatch();return;}
  if(state.blueScore>=state.killsToWin||state.redScore>=state.killsToWin){endMatch();return;}
  const now=performance.now();
  recordSnapshots(now);
  tickJumpPads(dt);
  updatePickups(dt,now);
  updateCasings(dt);
  updatePlayer(dt);
  for(const b of bots)updateBot(b,dt);
  updateEffects(dt);
  updateDamageNumbers(dt);
  if(deathScreenEl.classList.contains('on')){
    leaderboardRefreshTimer-=dt;
    if(leaderboardRefreshTimer<=0){leaderboardRefreshTimer=0.4;buildLeaderboard();}
  }else{
    updateHUD();
    updateScoreboard();
    minimapTimer-=dt;
    if(minimapTimer<=0){minimapTimer=0.05;drawMinimap();}
    updateMarkers();
    updateEnemyTag();
  }
  if(announceTimer>0)announceTimer-=dt;
}
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  let dt=(now-lastTime)/1000;lastTime=now;
  dt=Math.min(dt,0.05);
  fpsFrames++; fpsAccum+=dt;
  if(fpsAccum>=0.5){
    const fps=Math.round(fpsFrames/fpsAccum);
    fpsFrames=0;fpsAccum=0;
    if(showFps)fpsEl.textContent='FPS '+fps;
  }
  if(killcam.active)updateKillcam(dt);
  else if(state.running)update(dt);
  else{updateEffects(dt);updateCasings(dt);updateDamageNumbers(dt);}
  renderer.render(scene,camera);
}

function rebuildPreview(){
  if(pCat)pPivot.remove(pCat);
  state.custom.fur=uiFur.value;state.custom.accent=uiAcc.value;state.custom.eye=uiEye.value;
  pCat=buildCat({fur:uiFur.value,accent:uiAcc.value,eye:uiEye.value,team:menuTeam});
  pPivot.add(pCat);
  pCat.userData.arms[0].rotation.x=-0.5;
  pCat.userData.arms[1].rotation.x=-0.5;
}
[uiFur,uiAcc,uiEye].forEach(el=>el.addEventListener('input',rebuildPreview));
uiName.addEventListener('input',()=>{state.name=uiName.value||'Cat';});
document.querySelectorAll('.teams button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.teams button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');menuTeam=btn.dataset.team;rebuildPreview();
  });
});
document.querySelectorAll('.modes button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.modes button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.mode=parseInt(btn.dataset.mode,10);
  });
});
rebuildPreview();
let lastPreviewT=performance.now();
function previewLoop(){
  requestAnimationFrame(previewLoop);
  const now=performance.now();
  let dt=(now-lastPreviewT)/1000;lastPreviewT=now;
  dt=Math.min(dt,0.05);
  const w=previewCanvas.clientWidth,h=previewCanvas.clientHeight;
  if(previewCanvas.width!==w*pRenderer.getPixelRatio()){
    pRenderer.setSize(w,h,false);
    pCamera.aspect=w/h;pCamera.updateProjectionMatrix();
  }
  const t=now*0.0006;
  pPivot.rotation.y=t;
  if(pCat){
    pCat.userData.tail.rotation.y=Math.sin(t*5)*0.4;
    pCat.userData.tail.rotation.x=Math.sin(t*3.4)*0.1;
    pCat.position.y=Math.sin(t*3)*0.03;
    pBlinkTimer-=dt;
    if(pBlinkTimer<=0){pBlinkTimer=rand(2.5,5.5);pBlinkPhase=0.15;}
    if(pBlinkPhase>0){
      pBlinkPhase-=dt;
      const p=1-Math.abs(pBlinkPhase/0.15-0.5)*2;
      const squash=1-p*0.9;
      pCat.userData.eyes.forEach(e=>e.scale.y=squash);
    }else pCat.userData.eyes.forEach(e=>e.scale.y=1);
    pTwitchTimer-=dt;
    if(pTwitchTimer<=0){pTwitchTimer=rand(3,8);pTwitchPhase=0.2;}
    if(pTwitchPhase>0){
      pTwitchPhase-=dt;
      const p=1-Math.abs(pTwitchPhase/0.2-0.5)*2;
      const tw=p*0.35;
      pCat.userData.ears.forEach((ear,i)=>{
        ear.rotation.z=ear.userData.baseRotZ+(i?tw:-tw);
      });
    }else pCat.userData.ears.forEach(ear=>{ear.rotation.z=ear.userData.baseRotZ;});
  }
  pRenderer.render(pScene,pCamera);
}
previewLoop();
$('playBtn').addEventListener('click',()=>{
  initAudio();
  state.name=(uiName.value||'Cat').slice(0,12);
  state.team=menuTeam;
  state.custom.fur=uiFur.value;state.custom.accent=uiAcc.value;state.custom.eye=uiEye.value;
  pawMat.color.set(state.custom.accent);
  $('menu').classList.add('hide');
  startMatch();
  const p=canvas.requestPointerLock();
  if(p&&p.catch)p.catch(()=>{});
});
</script>
</body>
</html>
